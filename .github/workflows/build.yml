name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build ZapretLauncher.csproj -c Release -o out

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ZapretLauncher
          path: |
            out/ZapretLauncher.exe
            out/ZapretLauncherSetup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/ZapretLauncher.exe
            out/ZapretLauncherSetup.exe
          generate_release_notes: true
